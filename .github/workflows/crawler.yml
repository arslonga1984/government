name: 정부 지원사업 자동 크롤링 및 이메일 발송

on:
  schedule:
    - cron: '0 1 * * 2,5'  # 매주 화/금 오전 10시 (KST)
  workflow_dispatch:         # 수동 실행 버튼 (테스트용)

jobs:
  crawl-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: S3에서 DB 다운로드
        run: |
          aws s3 cp s3://subsidy-crawler-db/subsidy_crawler.db ./subsidy_crawler.db || echo "No existing DB, starting fresh"

      - name: 크롤링 → 매칭 → 이메일 발송
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MATCHING: ${{ secrets.LLM_MATCHING }}
          MATCH_SCORE_THRESHOLD: ${{ secrets.MATCH_SCORE_THRESHOLD }}
        run: python main.py run

      - name: DB를 S3에 업로드
        if: always()
        run: |
          aws s3 cp ./subsidy_crawler.db s3://subsidy-crawler-db/subsidy_crawler.db
