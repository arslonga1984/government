name: 정부 지원사업 자동 크롤링 및 이메일 발송

on:
  schedule:
    - cron: '0 1 * * 2,5'  # 매주 화/금 오전 10시 (KST)
  workflow_dispatch:         # 수동 실행 버튼 (테스트용)

jobs:
  crawl-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: 크롤링 → 매칭 → 이메일 발송
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MATCHING: "false"
          MATCH_SCORE_THRESHOLD: "40"
        run: python main.py run

      - name: DB 커밋 (중복 발송 방지)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subsidy_crawler.db
          git diff --staged --quiet || git commit -m "chore: DB 업데이트 $(date '+%Y-%m-%d')"
          git push
